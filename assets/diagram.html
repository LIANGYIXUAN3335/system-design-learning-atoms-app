<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="./mermaid.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #root { padding: 6px 4px; display: flex; justify-content: center; }
  #root svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  function post(msg) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
  }

  window.__render = async function (spec, dark) {
    if (typeof mermaid === 'undefined') {
      post('ERR:mermaid.js failed to load (cached copy missing or corrupt)');
      return;
    }
    try {
      mermaid.initialize({
        startOnLoad: false,
        theme: dark ? 'dark' : 'neutral',
        securityLevel: 'loose',
        fontFamily: '-apple-system, "PingFang SC", sans-serif',
      });
      var out = await mermaid.render('atoms-diagram', spec);
      document.getElementById('root').innerHTML = out.svg;
      setTimeout(function () {
        var h = document.getElementById('root').scrollHeight || document.body.scrollHeight;
        post('H:' + h);
      }, 30);
    } catch (e) {
      post('ERR:' + ((e && e.message) || String(e)));
    }
  };

  // Handshake: the RN side waits for READY before injecting the render call,
  // so we never race the 3.4MB mermaid.js parse on slow devices.
  post('READY');
</script>
</body>
</html>
